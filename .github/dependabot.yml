version: 2
updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - chore
      - dependencies
    # One PR per group instead of one per package
    groups:
      development-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - chore
      - dependencies
