name: CI

# CI is opt-in: it runs only when the `run-ci` label is added to a PR
# targeting main. The label is removed automatically when the run
# finishes; re-add it to trigger a new run.
on:
  pull_request:
    types: [labeled]
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    if: github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  security:
    if: github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Production dependencies only: dev-toolchain advisories (bundler,
      # test runner) don't ship in the extension and would block CI on
      # issues we can't fix ourselves.
      - run: npm audit --omit=dev --audit-level=high

  clear-run-ci-label:
    needs: [test, lint, security]
    if: always() && github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'run-ci'
              })
            } catch (error) {
              if (error.status !== 404) throw error
            }
